<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VUP 音乐歌单系统">
  <title>VUP 音乐歌单 - The Next</title>
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      min-height: 100vh;
    }
  </style>
  <div id="env-guide" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 999999; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="padding: 20px; text-align: center;">
        <div style="text-align: right;">
            <img src="https://img.alicdn.com/tfs/TB1mY69u7T2gK0jSZFkXXcIQFXa-653-381.png" style="width: 70%; max-width: 280px;" alt="请点击右上角">
        </div>

        <div style="margin-top: 30px;">
            <h2 style="color: #333; font-size: 20px; margin-bottom: 10px;">请在浏览器中打开</h2>
            <p style="color: #666; font-size: 15px; line-height: 1.6;">
                当前环境（微信/QQ）无法获得流畅体验。<br>
                请点击右上角 <strong style="color: #07C160;">···</strong> 选择 <strong style="color: #07C160;">“在浏览器打开”</strong>
            </p>
        </div>

        <div style="margin-top: 40px; padding: 20px; background: #f8f9fa; border-radius: 12px; border: 1px dashed #ddd;">
            <p style="font-size: 13px; color: #999; margin-bottom: 10px;">或者复制下方链接手动粘贴</p>
            <div id="current-url" style="word-break: break-all; color: #333; font-weight: 500; font-size: 14px; margin-bottom: 15px; padding: 0 10px;">
                </div>
            <button id="copy-btn" style="background: #07C160; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(7,193,96,0.2);">
                一键复制链接
            </button>
            <div id="copy-toast" style="display: none; margin-top: 10px; font-size: 12px; color: #07C160; font-weight: bold;">✅ 已复制到剪贴板</div>
        </div>
    </div>
</div>
